static_resources:
  listeners:
    - name: grpc_web_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  stat_prefix: sso_grpc_web
                  codec_type: AUTO
                  use_remote_address: true
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: sso
                      domains: ["*"]
                      # CORS is enforced here, not in the app — sso itself has
                      # no HTTP layer to attach headers to.
                      cors:
                        allow_origin_string_match:
                          - exact: "https://app.example.com"
                        allow_methods: POST, GET, OPTIONS
                        allow_headers: content-type,x-grpc-web,x-user-agent,grpc-timeout,authorization
                        expose_headers: grpc-status,grpc-message
                        max_age: "1728000"
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: sso_grpc
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: sso_grpc
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      # sso is plaintext gRPC (see docs/Connecting.md: insecure.NewCredentials()
      # unless a TLS sidecar sits in front of it) — h2c, no TLS to the upstream.
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: sso_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: sso
                      port_value: 44044

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
