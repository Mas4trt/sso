run:
  timeout: 3m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - unused
    - ineffassign
    - bodyclose
    - unconvert
    - misspell

linters-settings:
  errcheck:
    exclude-functions:
      - (*database/sql.Rows).Close

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec